<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- difff app icon: two document panels, red removed / green added -->

  <!-- Background -->
  <rect width="48" height="48" rx="10" fill="#161b22"/>

  <!-- ── Left panel ── -->
  <rect x="3" y="6" width="19" height="36" rx="3" fill="#0d1117"/>

  <!-- Removed rows (red tint) -->
  <rect x="3" y="11" width="19" height="5.5" rx="0" fill="#3d0f10"/>
  <rect x="3" y="20" width="19" height="5.5" rx="0" fill="#3d0f10"/>

  <!-- Red diff lines -->
  <rect x="6" y="12.5" width="12" height="2" rx="1" fill="#f85149"/>
  <rect x="6" y="21.5" width="9"  height="2" rx="1" fill="#f85149"/>

  <!-- Neutral lines -->
  <rect x="6" y="30" width="13" height="2" rx="1" fill="#484f58"/>
  <rect x="6" y="34" width="10" height="2" rx="1" fill="#484f58"/>
  <rect x="6" y="38" width="11" height="2" rx="1" fill="#484f58"/>

  <!-- ── Divider ── -->
  <rect x="22" y="4" width="4"  height="40" fill="#21262d"/>
  <rect x="23" y="4" width="2"  height="40" fill="#30363d"/>

  <!-- ── Right panel ── -->
  <rect x="26" y="6" width="19" height="36" rx="3" fill="#0d1117"/>

  <!-- Added rows (green tint) -->
  <rect x="26" y="11" width="19" height="5.5" rx="0" fill="#0d2e17"/>
  <rect x="26" y="20" width="19" height="5.5" rx="0" fill="#0d2e17"/>
  <rect x="26" y="29" width="19" height="5.5" rx="0" fill="#0d2e17"/>

  <!-- Green diff lines -->
  <rect x="29" y="12.5" width="12" height="2" rx="1" fill="#3fb950"/>
  <rect x="29" y="21.5" width="10" height="2" rx="1" fill="#3fb950"/>
  <rect x="29" y="30.5" width="11" height="2" rx="1" fill="#3fb950"/>

  <!-- Neutral lines -->
  <rect x="29" y="38" width="10" height="2" rx="1" fill="#484f58"/>
</svg>
